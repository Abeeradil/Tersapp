spring.application.name=Tears

#server.port=9090
server.port=${PORT:8080}
server.address=0.0.0.0

app.base-url=https://tersapp-production.up.railway.app

# database url
#spring.datasource.url=jdbc:mysql://localhost:3311/tears
#spring.datasource.username=root
#spring.datasource.password=root

moyasar.webhook.token=tears_webhook_2026_secure_9xA71#


# Twilio
twilio.account.sid=${TWILIO_SID}
twilio.auth.token=${TWILIO_TOKEN}
twilio.service.sid=${TWILIO_SERVICE_SID}

# ????? ????????
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=mySuperSecretKey12345678901234567890123456789012
jwt.expiration=432000000

# ??? ???????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

ocr.script.path=python/ocr.py

# Tesseract OCR
tesseract.language=ara+eng
tesseract.datapath=/app/tessdata


# ????? ???????
server.error.include-message=always
server.error.include-stacktrace=always

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
server.forward-headers-strategy=framework

moyasar:
secret-key: ${MOYASAR_SECRET_KEY}
callback-url: ${MOYASAR_CALLBACK_URL}

