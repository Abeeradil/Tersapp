<!DOCTYPE html>
<html lang="ar">
<head>

    <meta charset="UTF-8"/>

    <style>

        @font-face{
            font-family:'Cairo';
            src:url("fonts/Cairo-Regular.ttf");
        }

        body{
            font-family: Cairo;
            direction: rtl;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        td,th{
            border:1px solid #000;
            padding:8px;
            text-align:center;
        }

        h2{
            text-align:center;
        }

    </style>

</head>

<body>

<h2>تقرير التسعير</h2>

<p><b>Report No:</b> ${reportNumber}</p>

<p><b>رقم الطلب:</b> ${orderNumber}</p>

<p><b>اسم العميل:</b> ${customerName}</p>

<p><b>السيارة:</b> ${carModel}</p>

<p><b>المشكلة:</b></p>

<p>${problem}</p>

<table>

    <tr>
        <th>القطعة</th>
        <th>الكمية</th>
        <th>سعر القطعة</th>
        <th>الأجور</th>
        <th>الإجمالي</th>
    </tr>

    ${rows}

</table>

<h3>
    الإجمالي النهائي: ${grandTotal} ريال
</h3>

</body>
</html>
